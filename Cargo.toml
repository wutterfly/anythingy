[package]
name = "anythingy"
version = "0.3.5"
edition = "2024"
rust-version = "1.88"
description = "Collections with different space/time trade-offs: a type-erased Thing, a generational TokenStore, InlineVec, LinearMap and LinearSet, a type map and an event queue."
license = "MIT"
repository = "https://github.com/wutterfly/anythingy"
readme = "README.md"
keywords = ["data-structures", "collections", "type-map", "generational-index", "no-std"]
categories = ["data-structures", "no-std"]
exclude = [".github/"]

[features]
default = ["std"]
# Enables `EventQueue`, which needs threads, thread-locals and `Mutex`.
# Everything else works with only `core` and `alloc`.
std = []

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
crossbeam-channel = "0.5.17"
slotmap = "1.1.1"
smallvec = "1.16.2"

[[bench]]
name = "atomic_ref_cell"
harness = false

[[bench]]
name = "atomic_slot"
harness = false

[[bench]]
name = "linear_map"
harness = false

[[bench]]
name = "inline_map"
harness = false
required-features = ["std"]

[[bench]]
name = "inline_vec"
harness = false

[[bench]]
name = "linear_set"
harness = false

[[bench]]
name = "event_queue"
harness = false
required-features = ["std"]

[[bench]]
name = "thing"
harness = false

[[bench]]
name = "thing_map"
harness = false
required-features = ["std"]

[[bench]]
name = "token_store"
harness = false

[[example]]
name = "event_queue"
required-features = ["std"]

[[example]]
name = "inline_map"
required-features = ["std"]

[[example]]
name = "thing_map"
required-features = ["std"]

[[example]]
name = "sthing_map"
required-features = ["std"]

[profile.bench]
lto = "fat"
codegen-units = 1
