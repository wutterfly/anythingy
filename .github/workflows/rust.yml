name: Rust

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build and test on stable and nightly, with and without the `std` feature,
  # in debug and release mode.
  test:
    name: test (${{ matrix.toolchain }}${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly]
        features: ["", " --no-default-features"]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --no-self-update && rustup default ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets${{ matrix.features }}
      - name: Test
        run: cargo test${{ matrix.features }}
      - name: Test (release)
        run: cargo test --release${{ matrix.features }}

  # The library must keep building on the oldest supported Rust version.
  # This is the `rust-version` in Cargo.toml.
  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo +1.88.0 check --lib
      - name: Check (no default features)
        run: cargo +1.88.0 check --lib --no-default-features

  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Docs (no default features)
        run: cargo doc --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Everything except `EventQueue`, `ThingMap` and `SThingMap` must build
  # for a target that has no standard library.
  no-std:
    name: no_std (bare metal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --target thumbv7em-none-eabi --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --lib --no-default-features --target thumbv7em-none-eabi

  # Part of the crate is `unsafe` code, so its unit tests run under Miri, once,
  # with strict provenance and alignment checking. The `linear_*` modules are
  # entirely safe code, and doctests only repeat what the unit tests cover, so
  # both are skipped to keep this job short.
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install nightly --profile minimal --component miri --allow-downgrade --no-self-update && rustup default nightly
      - uses: Swatinem/rust-cache@v2
      - name: Miri
        run: cargo miri test --lib -- --skip linear_
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check
